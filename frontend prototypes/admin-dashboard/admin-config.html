<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Admin Configuration • Event Ease</title>

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="admin-common.css" />
		<link rel="stylesheet" href="../style.css" />

		<style>
			body {
				font-family: Inter, system-ui, Arial;
				background: #fff7f7;
			}
			.app-main-config {
				padding: 16px;
			}
			.card {
				border-radius: 12px;
			}
			.card-body {
				padding: 16px;
			}
			.card-header {
				padding: 10px 16px;
			}
			.form-label {
				font-size: 13px;
				font-weight: 500;
				margin-bottom: 4px;
			}
			.row.g-3 {
				--bs-gutter-y: 0.75rem;
			}
			h6 {
				margin-bottom: 6px;
			} /* Section separation */
			.section-divider {
				border-top: 1px dashed #e5e7eb;
				margin: 12px 0;
			}

			/* Card refinement */
			.card {
				background: #ffffff;
			}

			/* Inputs focus */
			.form-control:focus {
				box-shadow: none;
				border-color: #dc3545;
			}

			/* Button refinement */
			.btn-danger {
				background-color: #dc3545;
				border-color: #dc3545;
			}

			.btn-danger:hover {
				background-color: #bb2d3b;
				border-color: #bb2d3b;
			}

			/* Title row */
			h5 {
				font-weight: 600;
			}
		</style>
	</head>

	<body>
		<main class="app-main-config container">
			<!-- TITLE ROW -->
			<div class="d-flex justify-content-between align-items-center mb-2">
				<h5 class="text-danger mb-0">🏫 Admin Configuration</h5>

				<a href="profile.html" class="btn btn-sm btn-outline-secondary">
					← Back to Profile
				</a>
			</div>

			<p class="text-muted small mb-2">
				Institution-level settings used across events, certificates, and
				reports.
			</p>

			<div class="alert alert-warning py-2 px-3 small mb-3">
				<strong>Warning:</strong> Incorrect values may affect official
				data.
			</div>

			<div class="card shadow-sm">
				<div
					class="card-header fw-semibold d-flex justify-content-between align-items-center"
				>
					<span>Institution Details</span>
					<button
						class="btn btn-sm btn-outline-danger"
						onclick="lockConfig()"
					>
						🔒 Lock
					</button>
				</div>

				<div class="card-body">
					<!-- BASIC INFO -->
					<h6 class="text-secondary">Basic Information</h6>
					<div class="row g-3 mb-3">
						<div class="col-md-6">
							<label class="form-label">Institution Name</label>
							<input
								id="instName"
								class="form-control form-control-sm"
								placeholder="XYZ Institute of Technology"
							/>
						</div>

						<div class="col-md-6">
							<label class="form-label">Institution Code</label>
							<input
								id="instCode"
								class="form-control form-control-sm"
								placeholder="XYZ-ENG-001"
							/>
						</div>

						<div class="col-md-6">
							<label class="form-label"
								>Affiliated University</label
							>
							<input
								id="instUniversity"
								class="form-control form-control-sm"
								placeholder="Dr. A.P.J. Abdul Kalam Technical University"
							/>
						</div>

						<div class="col-md-6">
							<label class="form-label">Academic Session</label>
							<input
								id="instSession"
								class="form-control form-control-sm"
								placeholder="2025–2026"
							/>
						</div>
					</div>
					<div class="section-divider"></div>

					<!-- CONTACT -->
					<!-- <h6 class="text-secondary">Official Contact</h6> -->
					<div class="row g-3 mb-3">
						<div class="col-md-6">
							<label class="form-label">Official Email</label>
							<input
								id="instEmail"
								type="email"
								class="form-control form-control-sm"
								placeholder="info@xyzcollege.ac.in"
							/>
						</div>

						<div class="col-md-6">
							<label class="form-label">Official Phone</label>
							<input
								id="instPhone"
								class="form-control form-control-sm"
								placeholder="+91 9876543210"
							/>
						</div>
					</div>
					<div class="section-divider"></div>

					<!-- ADDRESS -->
					<!-- <h6 class="text-secondary">Address</h6> -->
					<div class="row g-3 mb-3">
						<div class="col-12">
							<label class="form-label"
								>Institution Address</label
							>
							<textarea
								id="instAddress"
								rows="2"
								class="form-control form-control-sm"
								placeholder="NH-24, Knowledge Park-III, Greater Noida, UP"
							></textarea>
						</div>

						<div class="col-md-4">
							<label class="form-label">City</label>
							<input
								id="instCity"
								class="form-control form-control-sm"
								placeholder="Greater Noida"
							/>
						</div>

						<div class="col-md-4">
							<label class="form-label">State</label>
							<input
								id="instState"
								class="form-control form-control-sm"
								placeholder="Uttar Pradesh"
							/>
						</div>

						<div class="col-md-4">
							<label class="form-label">PIN Code</label>
							<input
								id="instPincode"
								class="form-control form-control-sm"
								placeholder="201310"
							/>
						</div>
					</div>

					<div class="mt-3 text-center">
						<button
							class="btn btn-danger btn-sm px-4"
							onclick="saveInstitution()"
						>
							Save Configuration
						</button>
					</div>
				</div>
			</div>
		</main>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

		<script>
			(function confirmEntry() {
				const ok = confirm(
					"You are entering ADMIN CONFIGURATION.\n\n" +
						"Proceed only if you understand the impact.\n\nContinue?",
				);
				if (!ok) window.location.href = "profile.html";
			})();

			function saveInstitution() {
				const data = {
					name: instName.value,
					code: instCode.value,
					university: instUniversity.value,
					session: instSession.value,
					email: instEmail.value,
					phone: instPhone.value,
					address: instAddress.value,
					city: instCity.value,
					state: instState.value,
					pincode: instPincode.value,
					certAuthority: certAuthority.value,
					signatory: signatoryName.value,
				};
				localStorage.setItem("institution", JSON.stringify(data));
				alert("Configuration saved successfully.");
			}

			function lockConfig() {
				if (confirm("Lock configuration and return to profile?")) {
					window.location.href = "profile.html";
				}
			}

			(function loadData() {
				const data = JSON.parse(localStorage.getItem("institution"));
				if (!data) return;

				instName.value = data.name || "";
				instCode.value = data.code || "";
				instUniversity.value = data.university || "";
				instSession.value = data.session || "";
				instEmail.value = data.email || "";
				instPhone.value = data.phone || "";
				instAddress.value = data.address || "";
				instCity.value = data.city || "";
				instState.value = data.state || "";
				instPincode.value = data.pincode || "";
				certAuthority.value = data.certAuthority || "";
				signatoryName.value = data.signatory || "";
			})();
		</script>
	</body>
</html>
