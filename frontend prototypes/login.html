<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login Page</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: Arial, sans-serif;
			}

			body {
				height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				background: linear-gradient(135deg, #667eea, #764ba2);
			}

			.login-container {
				background: white;
				padding: 40px 30px;
				border-radius: 15px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
				width: 350px;
			}

			.login-container h2 {
				text-align: center;
				margin-bottom: 25px;
				color: #333;
			}

			.input-group {
				margin-bottom: 20px;
			}

			.input-group label {
				display: block;
				margin-bottom: 8px;
				font-size: 14px;
				color: #555;
			}

			.input-group input {
				width: 100%;
				padding: 12px 14px;
				border: 1px solid #ccc;
				border-radius: 8px;
				outline: none;
				font-size: 15px;
				transition: 0.3s;
			}

			.input-group input:focus {
				border-color: #667eea;
				box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
			}

			.login-btn {
				width: 100%;
				padding: 12px;
				border: none;
				border-radius: 8px;
				background: #667eea;
				color: white;
				font-size: 16px;
				cursor: pointer;
				transition: 0.3s;
			}

			.login-btn:hover {
				background: #5563d6;
			}

			.extra-text {
				text-align: center;
				margin-top: 15px;
				font-size: 14px;
				color: #666;
			}

			.extra-text a {
				color: #667eea;
				text-decoration: none;
			}

			.extra-text a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<div class="login-container">
			<h2>Login</h2>
			<form>
				<div class="input-group">
					<label for="email">Email</label>
					<input
						type="email"
						id="email"
						placeholder="Enter your email"
						required
					/>
				</div>

				<div class="input-group">
					<label for="password">Password</label>
					<input
						type="password"
						id="password"
						placeholder="Enter your password"
						required
					/>
				</div>

				<button type="submit" class="login-btn">Login</button>
			</form>

			<div class="extra-text">
				Don't have an account? <a href="#">Sign up</a>
			</div>
		</div>
	</body>
</html>
