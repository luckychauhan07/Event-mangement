<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Event Ease — Student Coordinator Profile</title>

  <!-- Fonts + Bootstrap -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <!-- Shared styles -->
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <!-- TOPBAR - NO search, NO bell, ONLY logo + logout dropdown -->
  <header class="topbar">
    <a href="sc-dashboard.html" class="d-flex align-items-center text-decoration-none">
        <img src="logo.svg" alt="Event Ease" style="height: 32px; width: auto; margin-right: 10px;">
        <div style="font-weight: 700; color: var(--text-dark);">Event Ease</div>
    </a>

    <!-- User dropdown (right side only) -->
    <div class="dropdown">
      <button class="btn d-flex align-items-center gap-2" data-bs-toggle="dropdown">
        <div
         class="rounded-circle bg-primary text-white"
         style="width: 36px; height: 36px; display: grid; place-items: center;"
       >
         SC
       </div>
       <div class="d-none d-md-block text-start">
         <div style="font-weight: 600;">Student Coord</div>
         <div class="small muted">you@college.edu</div>
       </div>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><hr class="dropdown-divider" /></li>
        <li><button class="dropdown-item text-danger" id="scLogoutTop">Logout</button></li>
      </ul>
    </div>
  </header>

  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="app-sidebar d-none d-lg-flex">
      <nav class="sidebar-nav">
        <a href="sc-dashboard.html">🏠 Dashboard</a>
        <a href="sc-events.html">📅 My Events</a>
        <a href="sc-teams.html">👥 Manage Teams</a>
        <a href="sc-participants.html">📋 Participants</a>
        <a href="sc-notifications.html">🔔 Notifications</a>
        
      </nav>
    </aside>

    <!-- MAIN - BACK BUTTON REMOVED -->
    <main class="app-main">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h4 class="mb-0">My Profile</h4>
          <div class="muted">View your coordinator details and basic preferences.</div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Left: profile summary -->
        <div class="col-12 col-lg-4">
          <div class="card-compact">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div
                class="rounded-circle bg-primary text-white"
                style="width: 64px; height: 64px; display: grid; place-items: center; font-size: 24px; font-weight: 600;"
              >
                SC
              </div>
              <div>
                <div style="font-weight: 600; font-size: 18px;" id="profileName">Student Coordinator X</div>
                <div class="muted small" id="profileEmail">you@college.edu</div>
                <div class="muted small">Role: Student Coordinator</div>
              </div>
            </div>

            <div class="mb-2">
              <div class="muted small">Assigned events</div>
              <div style="font-weight: 600;" id="profileEventsCount">2</div>
            </div>
            <div class="mb-2">
              <div class="muted small">Teams managed</div>
              <div style="font-weight: 600;" id="profileTeamsCount">3</div>
            </div>
            <div class="mb-3">
              <div class="muted small">Participants handled</div>
              <div style="font-weight: 600;" id="profileParticipantsCount">10</div>
            </div>

            <div class="mt-3">
              <button class="btn btn-outline w-100 btn-sm" id="btnViewActivity">
                View recent activity
              </button>
            </div>
          </div>
        </div>

        <!-- Right: editable details ONLY (NO notifications section) -->
        <div class="col-12 col-lg-8">
          <div class="card-compact">
            <h6 class="mb-3">Account details</h6>
            <form id="profileForm" class="row g-3">
              <div class="col-12 col-md-6">
                <label for="pfName" class="form-label">Full name</label>
                <input id="pfName" class="form-control" value="Student Coordinator X" />
              </div>
              <div class="col-12 col-md-6">
                <!-- INSTITUTIONAL EMAIL DISABLED - READ ONLY -->
                <label for="pfEmail" class="form-label">Institutional email</label>
                <input id="pfEmail" class="form-control" value="you@college.edu" readonly />
              </div>
              <div class="col-12 col-md-6">
                <label for="pfDept" class="form-label">Department / Course</label>
                <input id="pfDept" class="form-control" value="CSE" />
              </div>
              <div class="col-12 col-md-6">
                <label for="pfPhone" class="form-label">Phone</label>
                <input id="pfPhone" class="form-control" value="+91-98XXXXXXXX" />
              </div>
              <div class="col-12">
                <label for="pfBio" class="form-label">Short bio / note</label>
                <textarea
                  id="pfBio"
                  class="form-control"
                  rows="2"
                  placeholder="Optional note for teachers/admins..."
                ></textarea>
              </div>
              <div class="col-12 d-flex justify-content-end">
                <button type="button" id="btnSaveProfile" class="btn btn-primary">
                  Save changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JS - SAVE BUTTON NOW REDIRECTS TO DASHBOARD WITH 2s DELAY -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("scLogoutTop").addEventListener("click", () => {
      if (confirm("Logout from Student Coordinator account?")) {
        alert("Logged out.");
      }
    });

    const nameDisplay = document.getElementById("profileName");
    const emailDisplay = document.getElementById("profileEmail");

    const pfName = document.getElementById("pfName");
    const pfEmail = document.getElementById("pfEmail");
    const pfDept = document.getElementById("pfDept");
    const pfPhone = document.getElementById("pfPhone");
    const pfBio = document.getElementById("pfBio");

    document.getElementById("btnSaveProfile").addEventListener("click", () => {
      // Update name display (email stays permanent)
      nameDisplay.textContent = pfName.value || "Student Coordinator";
      
      // Show success message
      alert("Profile changes saved successfully! Redirecting to dashboard...");
      
      // Redirect to dashboard after 2 seconds
      setTimeout(() => {
        window.location.href = "sc-dashboard.html";
      }, 1000);
    });

    document.getElementById("btnViewActivity").addEventListener("click", () => {
      alert("Recent activity will appear here once the activity log is implemented.");
    });
  </script>
</body>
</html>
