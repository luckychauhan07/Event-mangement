<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Reports • Event Ease</title>

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

		<link rel="stylesheet" href="../style.css" />
		<link rel="stylesheet" href="admin-common.css" />

		<style>
			body {
				font-family: Inter, system-ui, Arial;
				background: var(--bg-light);
			}
			.card-box {
				background: #fff;
				border-radius: 12px;
				padding: 16px;
				box-shadow: var(--shadow-md);
			}
			.filter-label {
				font-size: 12px;
				font-weight: 500;
				color: #6b7280;
			}
			.kpi-value {
				font-size: 1.6rem;
				font-weight: 700;
			}
			.kpi-label {
				font-size: 0.8rem;
				color: #6b7280;
			}
			.growth {
				font-size: 0.75rem;
			}
			.growth.up {
				color: #16a34a;
			}
		</style>
	</head>

	<body>
		<header class="topbar">
			<a
				href="admin.html"
				class="d-flex align-items-center text-decoration-none"
			>
				<img
					src="../logo.svg"
					style="height: 32px; margin-right: 10px"
				/>
				<strong>Event Ease</strong>
			</a>
		</header>

		<div class="app-shell">
			<aside class="app-sidebar d-none d-lg-flex">
				<nav class="sidebar-nav">
					<a href="admin.html">🏠 Home</a>
					<a href="events.html">📅 Events</a>
					<a href="reports.html" class="active">📊 Reports</a>
				</nav>
			</aside>

			<main class="app-main">
				<div class="container-fluid">
					<h4 class="fw-semibold mb-3">
						📊 Institution Event Reports (Demo)
					</h4>

					<!-- FILTERS -->
					<div class="card-box mb-3">
						<div class="row g-2">
							<div class="col-md-2">
								<div class="filter-label">Academic Year</div>
								<select
									id="yearFilter"
									class="form-select form-select-sm"
								>
									<option value="All">All</option>
									<option>2024-25</option>
									<option>2025-26</option>
								</select>
							</div>

							<div class="col-md-2">
								<div class="filter-label">Semester</div>
								<select
									id="semesterFilter"
									class="form-select form-select-sm"
								>
									<option value="All">All</option>
									<option>Odd</option>
									<option>Even</option>
								</select>
							</div>

							<div class="col-md-2">
								<div class="filter-label">Category</div>
								<select
									id="categoryFilter"
									class="form-select form-select-sm"
								>
									<option value="All">All</option>
									<option>Technical</option>
									<option>Cultural</option>
									<option>Workshop</option>
									<option>Sports</option>
								</select>
							</div>

							<div class="col-md-2">
								<div class="filter-label">Gender</div>
								<select
									id="genderFilter"
									class="form-select form-select-sm"
								>
									<option value="All">All</option>
									<option>Male</option>
									<option>Female</option>
									<option>Mixed</option>
								</select>
							</div>

							<div class="col-md-4 d-flex align-items-end gap-2">
								<button
									class="btn btn-primary btn-sm w-100"
									onclick="applyFilters()"
								>
									Apply
								</button>
								<button
									class="btn btn-outline-success btn-sm w-100"
									onclick="exportCSV()"
								>
									CSV
								</button>
								<button
									class="btn btn-outline-danger btn-sm w-100"
									onclick="exportPDF()"
								>
									PDF
								</button>
							</div>
						</div>
					</div>

					<!-- KPIs -->
					<div class="row g-3 mb-3">
						<div class="col-md-3">
							<div class="card-box">
								<div id="kpiEvents" class="kpi-value">0</div>
								<div class="kpi-label">Total Events</div>
							</div>
						</div>

						<div class="col-md-3">
							<div class="card-box">
								<div id="kpiRegs" class="kpi-value">0</div>
								<div class="kpi-label">Registrations</div>
								<div class="growth up">▲ +11% YoY</div>
							</div>
						</div>

						<div class="col-md-3">
							<div class="card-box">
								<div id="kpiRevenue" class="kpi-value">₹0</div>
								<div class="kpi-label">Revenue</div>
								<div class="growth up">▲ +9% YoY</div>
							</div>
						</div>
					</div>

					<!-- CHARTS -->
					<div class="row g-3 mb-3">
						<div class="col-md-6">
							<div class="card-box">
								<canvas id="barChart"></canvas>
							</div>
						</div>
						<div class="col-md-6">
							<div class="card-box">
								<canvas id="pieChart"></canvas>
							</div>
						</div>
					</div>

					<div class="card-box mb-3">
						<canvas id="lineChart"></canvas>
					</div>

					<!-- TABLE -->
					<div class="card-box">
						<div class="fw-semibold mb-2">Event-wise Records</div>
						<div class="table-responsive">
							<table class="table table-sm align-middle">
								<thead>
									<tr>
										<th>Event</th>
										<th>Category</th>
										<th>Gender</th>
										<th>Date</th>
										<th>Semester</th>
										<th>Registrations</th>
										<th>Revenue</th>
									</tr>
								</thead>
								<tbody id="reportTable"></tbody>
							</table>
						</div>
					</div>
				</div>
			</main>
		</div>

		<script>
			/* =================== DUMMY INSTITUTION DATA =================== */

			const eventsData = [
				{
					title: "Ideathon 2025",
					category: "Technical",
					gender: "Mixed",
					date: "2025-03-10",
					regs: 120,
					revenue: 24000,
				},
				{
					title: "AI Workshop",
					category: "Workshop",
					gender: "Mixed",
					date: "2025-01-20",
					regs: 80,
					revenue: 40000,
				},
				{
					title: "Cultural Night",
					category: "Cultural",
					gender: "Female",
					date: "2025-02-15",
					regs: 300,
					revenue: 0,
				},
				{
					title: "Football League",
					category: "Sports",
					gender: "Male",
					date: "2024-08-05",
					regs: 70,
					revenue: 3500,
				},
				{
					title: "Hackathon",
					category: "Technical",
					gender: "Male",
					date: "2024-10-18",
					regs: 150,
					revenue: 30000,
				},
				{
					title: "Dance Fest",
					category: "Cultural",
					gender: "Female",
					date: "2024-11-25",
					regs: 200,
					revenue: 0,
				},
			];

			let filtered = [...eventsData];
			let barChart, pieChart, lineChart;

			/* =================== HELPERS =================== */
			function getYear(d) {
				const y = new Date(d).getFullYear();
				return d >= `${y}-07-01` ? `${y}-${y + 1}` : `${y - 1}-${y}`;
			}
			function getSemester(d) {
				const m = new Date(d).getMonth() + 1;
				return m >= 7 && m <= 12 ? "Odd" : "Even";
			}

			/* =================== CORE =================== */
			function applyFilters() {
				const y = yearFilter.value;
				const s = semesterFilter.value;
				const c = categoryFilter.value;
				const g = genderFilter.value;

				filtered = eventsData.filter(
					(e) =>
						(y === "All" || getYear(e.date) === y) &&
						(s === "All" || getSemester(e.date) === s) &&
						(c === "All" || e.category === c) &&
						(g === "All" || e.gender === g),
				);
				render();
			}

			function render() {
				renderKPIs();
				renderTable();
				renderCharts();
			}

			function renderKPIs() {
				kpiEvents.innerText = filtered.length;
				kpiRegs.innerText = filtered.reduce((t, e) => t + e.regs, 0);
				kpiRevenue.innerText =
					"₹" + filtered.reduce((t, e) => t + e.revenue, 0);
			}

			function renderTable() {
				reportTable.innerHTML = "";
				filtered.forEach((e) => {
					reportTable.innerHTML += `
		<tr>
			<td>${e.title}</td>
			<td>${e.category}</td>
			<td>${e.gender}</td>
			<td>${e.date}</td>
			<td>${getSemester(e.date)}</td>
			<td>${e.regs}</td>
			<td>${e.revenue ? "₹" + e.revenue : "—"}</td>
		</tr>`;
				});
			}

			function renderCharts() {
				if (barChart) barChart.destroy();
				if (pieChart) pieChart.destroy();
				if (lineChart) lineChart.destroy();

				const catMap = {},
					genMap = {},
					dateMap = {};
				filtered.forEach((e) => {
					catMap[e.category] = (catMap[e.category] || 0) + e.regs;
					genMap[e.gender] = (genMap[e.gender] || 0) + e.regs;
					dateMap[e.date] = (dateMap[e.date] || 0) + e.regs;
				});

				barChart = new Chart(document.getElementById("barChart"), {
					type: "bar",
					data: {
						labels: Object.keys(catMap),
						datasets: [
							{
								label: "Registrations",
								data: Object.values(catMap),
							},
						],
					},
				});

				pieChart = new Chart(document.getElementById("pieChart"), {
					type: "pie",
					data: {
						labels: Object.keys(genMap),
						datasets: [{ data: Object.values(genMap) }],
					},
				});

				lineChart = new Chart(document.getElementById("lineChart"), {
					type: "line",
					data: {
						labels: Object.keys(dateMap),
						datasets: [
							{ label: "Growth", data: Object.values(dateMap) },
						],
					},
				});
			}

			/* =================== EXPORTS =================== */
			function exportCSV() {
				let csv = "Event,Category,Gender,Date,Semester,Regs,Revenue\n";
				filtered.forEach((e) => {
					csv += `${e.title},${e.category},${e.gender},${e.date},${getSemester(e.date)},${e.regs},${e.revenue}\n`;
				});
				const a = document.createElement("a");
				a.href = URL.createObjectURL(new Blob([csv]));
				a.download = "institution-report.csv";
				a.click();
			}

			function exportPDF() {
				const { jsPDF } = window.jspdf;
				const pdf = new jsPDF();
				pdf.text("Institution Event Report", 10, 10);
				let y = 20;
				filtered.forEach((e) => {
					pdf.text(
						`${e.title} | ${e.category} | ${e.regs} regs`,
						10,
						y,
					);
					y += 8;
				});
				pdf.save("institution-report.pdf");
			}

			/* INIT */
			applyFilters();
		</script>
	</body>
</html>
